
services:
  mysql:
    image: mysql:8.0
    container_name: finiq-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: finiq_db
      MYSQL_USER: finiq
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - finiq_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12

  finiq:
    build: .
    container_name: finiq-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/finiq_db
      DB_USERNAME: finiq
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  finiq_mysql_data:
